name: 同步上游代码和Tags
on:
  # 1. 定时触发（每天凌晨3点，可修改 cron 表达式）
  schedule:
    - cron: '0 3 * * *'  # cron 格式：分 时 日 月 周（UTC时间，北京时间需+8小时，如想北京时间3点则写 0 19 * * *）
  # 2. 手动触发（在 GitHub 仓库的 Actions 页面点击运行）
  workflow_dispatch:
    inputs:
      sync_tags:
        description: '是否同步 Tags？'
        type: boolean
        default: true

env:
  # 配置变量（请根据实际情况修改！）
  UPSTREAM_REPO: https://github.com/SagerNet/sing-box.git
  TARGET_BRANCH: dev-next

jobs:
  sync-filtered-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送Tag
    steps:
      # 步骤1：检出本地仓库（仅需基础检出，无需完整历史）
      - name: 检出本地仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      # 步骤2：配置Git身份（推送Tag时需要）
      - name: 配置Git身份
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 步骤3：添加上游仓库远程地址
      - name: 添加上游仓库
        run: |
          git remote add upstream ${{ env.UPSTREAM_REPO }}
          git remote -v  # 验证上游是否添加成功
          git fetch upstream --tags  # 拉取上游所有Tag
          git pull upstream ${{ env.TARGET_BRANCH }} --allow-unrelated-histories  # 拉取上游代码（为Tag关联提交）
  
      # 核心步骤：筛选并推送Tag（合并原步骤5和6）
      - name: 筛选并推送「不含beta的最近5个Tag」
        run: |
          # 强制删除拉取的上游Workflow目录（如果存在）
          if [ -d ".github/workflows/" ]; then
              rm -rf .github/workflows/
              echo "🗑️  已删除上游的 $WORKFLOW_DIR 目录"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Sync upstream: remove workflow files (auto-commit by GitHub Actions)"
            echo "✅ 已创建新提交（清理Workflow文件后）"
          fi
          # 核心筛选逻辑（二选一，根据需求注释/取消注释）
          # 选项A：按Tag创建时间排序（默认，推荐）
          FILTERED_TAGS=$(git tag --sort=-creatordate | grep -vEi 'beta' | grep -vEi 'alpha'  | grep -vEi 'rc' | head -n 5)
          
          # 选项B：按Tag版本号排序（语义化版本如v1.0.0、v2.10.0适用）
          # FILTERED_TAGS=$(git tag | grep -vEi 'beta' | sort -Vr | head -n 5)

          # 打印筛选结果（调试用）
          echo "筛选出符合条件的Tag："
          echo "$FILTERED_TAGS"

          # 5. 重新关联Tag到当前提交（清理Workflow后的提交），并推送
          if [ -n "$FILTERED_TAGS" ]; then
            TAG_LIST=$(echo "$FILTERED_TAGS" | tr '\n' ' ')
            # 遍历每个Tag，强制指向当前提交（避免Tag关联到含Workflow的旧提交）
            for TAG in $TAG_LIST; do
              git tag -f "$TAG"  # 强制更新Tag指向当前提交
              echo "🔗 已将Tag $TAG 重新关联到清理后的提交"
            done
            # 推送新提交和强制更新后的Tag
            git push origin ${{ env.TARGET_BRANCH }}
            git push origin --tags -f  # -f 强制推送更新后的Tag（必需）
            echo "🚀 成功推送 ${#TAG_LIST[@]} 个Tag和清理后的代码"
          else
            echo "ℹ️  未找到符合条件的Tag（不含beta且最近5个），跳过推送"
          fi
